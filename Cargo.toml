[workspace]
resolver = "3"
members = ["crates/kawa-core", "crates/kawa-github", "crates/kawa-store", "crates/kawa", "crates/kawa-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
